<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reserve a board game at Boardwalk Games with our easy online booking form. Select your game, date, and details for a seamless reservation.">
    <link rel="canonical" href="https://boardwalk-games.co/assets/game-reservation-booking-form.html">
	<title>Reserve a Game | Boardwalk Games</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Macondo&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>

	<style>
		:root{--max-width:720px;--accent:#0b5cff}
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;padding:24px;background:#f6f8fb;color:#0b1a2b}
		.container{max-width:var(--max-width);margin:0 auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 6px 20px rgba(13,20,40,.08)}
		h1{font-size:1.25rem;margin:0 0 12px}
		p.lead{margin:0 0 18px;color:#556}
		form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
		label{display:block;font-size:.85rem;margin-bottom:6px;color:#113}
		input[type="text"],input[type="email"],input[type="tel"],input[type="date"],input[type="time"],select,textarea{width:100%;padding:10px;border:1px solid #d5dbe8;border-radius:8px;font-size:.95rem}
		textarea{min-height:90px;resize:vertical}
		.full{grid-column:1/3}
		.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;grid-column:1/3;margin-top:6px}
		.btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:none;cursor:pointer}
		.btn.secondary{background:#eef3ff;color:var(--accent);border:1px solid rgba(11,92,255,.12)}
		.help{font-size:.85rem;color:#556}
		@media (max-width:640px){form{grid-template-columns:1fr} .actions{flex-direction:column;align-items:stretch}}
	</style>
</head>
<body>
	<main class="container">
		<h1>Reserve a game</h1>
		<p class="lead">Reserve a board game for your next visit to Boardwalk Games. Pick your challenge, and let the adventure begin! Fill out your details and preferred game below, and we'll have it set aside for you when you arrive.</p>

		<form id="bookingForm" autocomplete="on" novalidate>
			<div class="full">
				<label for="fullName">Full name *</label>
                	<input id="fullName" name="fullName" type="text" autocomplete="name" required placeholder="Your full name">
                </div>

                <div class="full">
                	<label for="phone">Phone number *</label>
                	<input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="(555) 555-5555">
                </div>

                <div class="full">
                    <label for="email">Email address *</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
                </div>
                <div class="full">
				<label for="game">Game selection *</label>
				<select id="game" name="game" required>
					<option value="">Select game</option>
					<option>Galaxy Pioneers</option>
					<option>Mystic Woods</option>
					<option>Captain's Gambit</option>
					<option>Critter Quest</option>
					<option>Settlers of Catan</option>
					<option>Monopoly</option>
					<option>Exploding Kittens</option>
					<option>Cluedo</option>
				</select>
			</div>

			<div class="full">
				<label for="date">Requested date *</label>
				<input id="date" name="date" type="date" required>
			</div>

			<div class="full">
				<button type="submit" class="btn">Reserve a game</button>
			</div>
		</form>

		<script>
			document.getElementById('bookingForm').addEventListener('submit', function(e){
				e.preventDefault();
				if(!this.checkValidity()){
					this.reportValidity();
					return;
				}
				// Minimal client-side confirmation. Replace with real submit logic.
				alert('Thank you for booking, we will be in touch shortly to confirm your booking.');
				this.reset();
				window.location.href = '../index.html';
			});
		</script>
	</main>
</body>
</html>
